plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'ps.reso.instaeclipse'
    compileSdk 34

    defaultConfig {
        applicationId "ps.reso.instaeclipse"
        minSdkVersion 28
        targetSdk 36
        // Keep local builds unchanged, but let CI assign a monotonically increasing
        // version so APKs published from Actions can be installed as updates.
        def ciVersionCode = System.getenv("CI_VERSION_CODE")
        def ciVersionName = System.getenv("CI_VERSION_NAME")
        versionCode ciVersionCode != null ? Integer.parseInt(ciVersionCode) : 17
        versionName ciVersionName != null ? ciVersionName : '0.7.0'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    // Core Android dependencies
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.gson
    implementation libs.dexkit
    implementation 'com.google.android.material:material:1.12.0'
    implementation "androidx.documentfile:documentfile:1.1.0"
    implementation libs.osmdroid

    // External library for shared preferences
    implementation libs.fileprefs
    // Testing dependencies
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core.v361

    // Compile-only dependency
    compileOnly files('libs/api-82.jar')
}
