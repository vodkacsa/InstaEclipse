name: Build & Release APK

on:
  push:
    branches:
      - main
      - 0.4
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_apk:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Set build version
        shell: bash
        run: |
          echo "CI_VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "CI_VERSION_NAME=0.7.0-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Check signing configuration
        id: signing
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets are not configured. Building a debug artifact only; no GitHub Release will be created."
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        if: steps.signing.outputs.ready != 'true' || github.event_name == 'pull_request'
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        if: steps.signing.outputs.ready != 'true' || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Restore signing key
        if: steps.signing.outputs.ready == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/instaeclipse-signing.jks"

      - name: Build release APK
        if: steps.signing.outputs.ready == 'true' && github.event_name != 'pull_request'
        run: ./gradlew assembleRelease

      - name: Sign release APK
        if: steps.signing.outputs.ready == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p dist
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          TAG="build-${GITHUB_RUN_NUMBER}"
          ALIGNED="dist/InstaEclipse-${TAG}-aligned.apk"
          APK="dist/InstaEclipse-${TAG}.apk"

          "$BUILD_TOOLS/zipalign" -f -p 4             app/build/outputs/apk/release/app-release-unsigned.apk             "$ALIGNED"

          "$BUILD_TOOLS/apksigner" sign             --ks "$RUNNER_TEMP/instaeclipse-signing.jks"             --ks-key-alias "$KEY_ALIAS"             --ks-pass env:KEYSTORE_PASSWORD             --key-pass env:KEY_PASSWORD             --out "$APK"             "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          rm -f "$ALIGNED"
          echo "SIGNED_APK=$APK" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Upload signed APK
        if: steps.signing.outputs.ready == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: ${{ env.SIGNED_APK }}

      - name: Create GitHub Release
        if: steps.signing.outputs.ready == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" "$SIGNED_APK"             --target "$GITHUB_SHA"             --title "InstaEclipse $RELEASE_TAG"             --notes "Automated APK build from commit $GITHUB_SHA."
