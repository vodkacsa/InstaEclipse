name: Build profile-enhancements release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Test and build installable APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
      - name: Verify APK signature and package
        run: |
          SDK_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK_TOOLS/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$SDK_TOOLS/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -1
      - uses: actions/upload-artifact@v4
        with:
          name: InstaEclipse-0.7.0-tomi.3
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish downloadable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk InstaEclipse-0.7.0-tomi.3.apk
          sha256sum InstaEclipse-0.7.0-tomi.3.apk > SHA256SUMS.txt
          gh release create v0.7.0-tomi.3 InstaEclipse-0.7.0-tomi.3.apk SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title 'InstaEclipse 0.7.0-tomi.3: full profile pictures' \
            --prerelease --notes-file PROFILE_RELEASE.md
